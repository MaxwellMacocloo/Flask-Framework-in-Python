<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Scorecard{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1><a href="{{ url_for('web.index') }}">Student Scorecard</a></h1>
    <nav>
      <a href="{{ url_for('web.index') }}">Dashboard</a>
      <a href="{{ url_for('web.submit') }}">Add student</a>
      <a href="{{ url_for('web.about') }}">About</a>
      <a href="{{ url_for('api.list_students') }}">API</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <p>Flask &middot; Jinja2 &middot; REST API</p>
  </footer>
</body>
</html>
